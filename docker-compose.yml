services:
  redis:
    image: redis:7-alpine
    container_name: redis_learning
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  mongo:
    image: mongo:7
    container_name: mongo_learning
    environment:
      MONGO_INITDB_DATABASE: redis_mongo_docker
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  redis_data:
  mongo_data:
